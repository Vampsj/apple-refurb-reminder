[project]
name = "apple-refurb-reminder"
version = "1.0.0b1"
description = "Monitor regional Apple refurbished inventory and send stock notifications."
readme = "README.md"
license = "MIT"
authors = [{ name = "JUNJIE ZHOU" }]
requires-python = ">=3.13"
dependencies = ["PyYAML>=6.0.2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/Vampsj/apple-refurb-reminder"
Issues = "https://github.com/Vampsj/apple-refurb-reminder/issues"
Repository = "https://github.com/Vampsj/apple-refurb-reminder"

[project.scripts]
apple-refurb-reminder = "apple_refurb_reminder.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_refurb_reminder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
